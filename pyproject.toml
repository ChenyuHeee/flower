[project]
name = "flower"
version = "0.1.0"
description = "Portable long-horizon agent built on the Claude Agent SDK"
requires-python = ">=3.10"
dependencies = ["claude-agent-sdk>=0.2.152"]

[project.scripts]
flower = "flower.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flower"]
