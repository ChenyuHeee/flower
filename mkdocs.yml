site_name: flower
site_description: 基于 Claude Agent SDK 的可移植长程 agent 框架
site_url: https://chenyuheee.github.io/flower/
repo_url: https://github.com/ChenyuHeee/flower
repo_name: ChenyuHeee/flower
docs_dir: docs
copyright: flower —— 可移植长程 agent 框架

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: 切到暗色
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: 切到亮色
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - search.suggest
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details

nav:
  - 开始: index.md
  - 快速上手: start.md
  - 机制:
    - 设计一个流程: workflow.md
    - 前置确认: clarify.md
    - 目标看守: goal.md
    - 接续(同一路径续跑): continuity.md
    - 换代(上下文满了不 compact): handoff.md
    - 换交互层: interaction.md
  - 真实运行案例:
    - HT001 · 从零写一个终端 IDE: case-ht001.md
    - HT002 · 装到 macOS 上跑起来: case-ht002.md

validation:
  links:
    not_found: warn        # 指向仓库根 README 的相对链不在 site 里,只告警不失败
