name: docs
on:
  push:
    branches: [main]
    paths: [docs/**, mkdocs.yml, hooks/**, docs-requirements.txt, install.sh, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install -r docs-requirements.txt
      # --strict: a broken internal link or a nav entry pointing at a missing
      # page fails the build instead of silently shipping a 404.
      - run: mkdocs build --strict
      # 安装脚本挂到 Pages 域名上 —— raw.githubusercontent.com 在国内不通,
      # 而 *.github.io 通(实测)。朋友 curl 的是这个 URL。
      - run: cp install.sh site/install.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
